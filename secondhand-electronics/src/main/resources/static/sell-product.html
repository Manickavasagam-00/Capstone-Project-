<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell Product - Second-Hand Electronics</title>

    <link rel="stylesheet" href="sell-product.css">

</head>

<body>

    <div class="header">

        <h1>Second-Hand Electronics</h1>

        <p>Sell Your Electronics</p>

    </div>

    <div class="container">

        <div class="form-box">

            <h2>List Your Product</h2>

            <form id="productForm">

                <label>Product Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Example: Samsung Galaxy S23"
                    required
                >


                <label>Brand</label>

                <input
                    type="text"
                    id="brand"
                    placeholder="Example: Samsung"
                    required
                >


                <label>Category</label>

                <input
                    type="text"
                    id="category"
                    placeholder="Example: Smartphone"
                    required
                >


                <label>Description</label>

                <textarea
                    id="description"
                    placeholder="Describe your product"
                    required
                ></textarea>


                <label>Price</label>

                <input
                    type="number"
                    id="price"
                    placeholder="Enter price"
                    required
                >


                <label>Condition</label>

                <select id="condition" required>

                    <option value="">Select condition</option>

                    <option value="New">New</option>

                    <option value="Like New">Like New</option>

                    <option value="Good">Good</option>

                    <option value="Fair">Fair</option>

                    <option value="Used">Used</option>

                </select>


                <label>Seller Name</label>

                <input
                    type="text"
                    id="sellerName"
                    placeholder="Enter your name"
                    required
                >


                <label>Seller Phone</label>

                <input
                    type="tel"
                    id="sellerPhone"
                    placeholder="Enter phone number"
                    required
                >


                <label>Image File Name</label>

                <input
                    type="text"
                    id="imageUrl"
                    placeholder="Example: iphone.jpg"
                    required
                >


                <button type="submit">
                    List Product
                </button>

            </form>

            <p id="message"></p>

        </div>

    </div>


    <script src="sell-product.js"></script>

</body>

</html>
